<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>保持好奇，去看更大的世界</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#202020;font-family:Arial,'PingFang SC',sans-serif}main{max-width:1000px;margin:auto;text-align:center;padding:64px 20px 0}small{color:#999;letter-spacing:3px;font-size:11px}h1{font-size:clamp(27px,4vw,44px);line-height:1.25;letter-spacing:-1px;margin:22px 0 12px}h1 span{color:#a3a3a3}p{color:#888;font-size:14px}button{border:1px solid #eee;background:white;padding:12px 24px;border-radius:30px;color:#555;margin:12px;cursor:pointer}.portrait{position:relative;width:min(640px,100%);margin:-5px auto 0;aspect-ratio:1}.portrait img,.portrait svg{position:absolute;width:100%;height:100%;inset:0}.portrait svg{overflow:visible;pointer-events:none}.scene{opacity:0;animation:swap 6s steps(1,end) infinite;transform-origin:580px 210px}.scene:nth-child(2){animation-delay:-4.5s}.scene:nth-child(3){animation-delay:-3s}.scene:nth-child(4){animation-delay:-1.5s}.ink{fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;animation:wiggle .25s steps(2,end) infinite}.scene text{font-family:cursive;font-size:65px;font-weight:bold} @keyframes swap{0%,24.99%{opacity:1}25%,100%{opacity:0}}@keyframes wiggle{0%{transform:rotate(-1deg) translateY(-1px)}100%{transform:rotate(1deg) translateY(1px)}}.paused *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){.scene,.ink{animation:none}.scene:first-child{opacity:1}}@media(max-width:500px){main{padding-top:40px}.portrait{margin-top:10px}}

/* Original reference: 11 frames, 100 ms each, 1.1 s loop.
   Head scale adapted to this portrait; the raised arm changes the body silhouette. */
.portrait{width:min(560px,100%);margin:24px auto 0}
.head-animation{position:absolute;left:43.85%;top:9%;width:26.3%;aspect-ratio:370/195;isolation:isolate;overflow:hidden}
.portrait .head-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;animation:showFrame 1.1s step-end infinite;backface-visibility:hidden}
@keyframes showFrame{0%,9.09%{opacity:1}9.1%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.portrait .head-frame{animation:none}.portrait .head-frame:first-child{opacity:1}}
</style>
<main><small>PORTRAIT IN MOTION</small><h1>保持好奇，<br><span>去看更大的世界。</span></h1><p>黑白人像 × 彩色手绘涂鸦</p><button id="toggle" aria-pressed="false">暂停动画</button><div class="portrait" id="portrait"><img src="portrait.png" alt="抬手望向远处的黑白人像"><div class="head-animation" aria-hidden="true"><img class="head-frame" style="animation-delay:0.0s" src="assets/reference-doodles/1.webp" alt=""><img class="head-frame" style="animation-delay:0.1s" src="assets/reference-doodles/2.webp" alt=""><img class="head-frame" style="animation-delay:0.2s" src="assets/reference-doodles/3.webp" alt=""><img class="head-frame" style="animation-delay:0.3s" src="assets/reference-doodles/4.webp" alt=""><img class="head-frame" style="animation-delay:0.4s" src="assets/reference-doodles/5.webp" alt=""><img class="head-frame" style="animation-delay:0.5s" src="assets/reference-doodles/6.webp" alt=""><img class="head-frame" style="animation-delay:0.6s" src="assets/reference-doodles/7.webp" alt=""><img class="head-frame" style="animation-delay:0.7s" src="assets/reference-doodles/8.webp" alt=""><img class="head-frame" style="animation-delay:0.8s" src="assets/reference-doodles/9.webp" alt=""><img class="head-frame" style="animation-delay:0.9s" src="assets/reference-doodles/10.webp" alt=""><img class="head-frame" style="animation-delay:1.0s" src="assets/reference-doodles/11.webp" alt=""></div></div></main>
<script>const b=document.getElementById('toggle'),p=document.getElementById('portrait');b.onclick=()=>{const paused=p.classList.toggle('paused');b.textContent=paused?'播放动画':'暂停动画';b.setAttribute('aria-pressed',String(paused))};</script>
</html>
